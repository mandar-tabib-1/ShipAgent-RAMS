[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shipagent-ai-system"
version = "0.1.0"
description = "Multi-Agent Predictive Maintenance & Navigation Framework for R/V Gunnerus"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["maritime", "ai", "rams", "sensor-fusion", "collision-avoidance", "ntnu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "streamlit>=1.30",
    "torch>=2.0",
    "torchvision>=0.15",
    "openai>=1.0",
    "requests>=2.28",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "GitPython>=3.1",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
# By default, torch is installed from PyPI (CPU-only wheels).
# For NVIDIA GPU support, override the torch index at sync time:
#
#   uv sync --extra-index-url https://download.pytorch.org/whl/cu121
#
# Or add a [tool.uv.sources] block below pointing to the CUDA index:
#
# [tool.uv.sources]
# torch = [{ index = "pytorch-cu121" }]
# torchvision = [{ index = "pytorch-cu121" }]
#
# [[tool.uv.index]]
# name = "pytorch-cu121"
# url = "https://download.pytorch.org/whl/cu121"
# explicit = true
